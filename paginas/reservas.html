<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Rueda Libre</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Mostrar u ocultar el menú">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu-principal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="tarifas.html">Tarifas</a></li>
                    <li class="nav-item"><a class="nav-link" href="tarifas.html#planes">Planes</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="reservas.html">Reservas</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="container d-flex flex-wrap justify-content-between align-items-center">
        <h1>Reserva tu bicicleta</h1>
        <p>Contactanos</p> <a class="btn btn-outline-dark" href="mailto:hola@ruedalibre.example">Escribir un correo a Rueda Libre</a>
    </header>

    <main class="container">
        <section id="formulario-reserva">
            <form action="/enviar-reserva" method="post">
                <fieldset>
                    <legend id="datos">Tus datos:</legend>
                    <p>
                        <label for="nombre">Nombre completo:</label>
                        <input type="text" 
                        id="nombre" 
                        name="nombre"
                        minlength="3"
                        maxlength="20" required>
                        

                        <label for="documento">Documento:</label>
                        <input type="text" 
                        inputmode="numeric"
                        id="documento" 
                        name="documento"
                        minlength="6"
                        maxlength="10" required>

                        <label for="email">Email:</label>
                        <input type="email" 
                        id="email" 
                        name="email"
                        placeholder="example@gmail.com" required>

                        <label for="celular">Celular:</label>
                        <input type="text"
                        inputmode="numeric" 
                        name="celular" 
                        id="celular" 
                        pattern="3[0-9]{2,9}"
                        placeholder="3121234567"
                        required
                        >

                    </p>
                </fieldset>

                <fieldset>
                    <legend id="alquiler">Tu alquiler:</legend>
                    <p>
                        <label for="tiempo">Fecha:</label>
                        <input type="date" 
                        id="tiempo" 
                        name="tiempo" 
                        min="2026-11-01"
                        max="2026-12-31" 
                        required>
                
                        <label for="bicicleta">Selecciona un tamaño:</label>
                            <select name="bicicleta" id="bicicleta">
                                <option value="pequeña">Urbana</option>
                                <option value="mediana">Montaña</option>
                                <option value="grande">Electrica</option>
                            </select>
                            
                        <label for="plan">Plan a escoger:</label>
                        <select name="plan" id="plan">
                            <option value="plan1">Rio y parques</option>
                            <option value="plan2">Sabores de barrio</option>
                            <option value="plan3">Reto las palmas</option>
                        </select>

                        <label for="cantidaddebicileta">Cantidad de Bicicletas:</label>
                        <input type="text" 
                        inputmode="numeric"
                        name="cantidad" 
                        id="cantidaddebicileta"
                        pattern="1[0-6]{1,2}">
                    
                    </p>                                
                </fieldset>

                <fieldset>
                    <legend id="confirmacion">Confirmacion:</legend>
                    <label for="comentarios">Comentarios:</label>
                    <input type="text" id="comentarios" name="comentarios" placeholder="comentarios" maxlength="300">

                    <label for="politicas">Politicas de alquiler:</label>
                    <input type="checkbox" id="politicas" name="politicas" required>
                    <label for="politicas">Aceptar</label>
                </fieldset>

                <fieldset>
                    <button class="btn btn-primary btn-lg" type="submit">ENVIAR</button>
                </fieldset>

            </form>
        </section>
    </main>


    <footer>
        <p>Rueda libre</p>
        <p><a class="btn btn-outline-dark btn-sm" href="mailto:hola@ruedalibre.example">Contactanos</a></p>
        <p>2026</p>
    </footer>

    <a class="whatsapp btn btn-dark" href="https://wa.me/573000000000" target="_blank" rel="noopener noreferrer">WhatsApp</a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
